[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-of-life"
version = "2.0.0"
description = "An interactive Conway's Game of Life playground built with PyQt6"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Radis" }]
keywords = ["game-of-life", "cellular-automata", "pyqt6", "simulation", "desktop"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Life",
]
dependencies = ["PyQt6>=6.5"]

[project.scripts]
game-of-life = "game_of_life.__main__:main"

[project.urls]
Homepage = "https://github.com/Y-deva/game-of-life"
Repository = "https://github.com/Y-deva/game-of-life"
Issues = "https://github.com/Y-deva/game-of-life/issues"

[tool.setuptools]
packages = ["game_of_life"]

[tool.setuptools.package-data]
game_of_life = ["py.typed"]
